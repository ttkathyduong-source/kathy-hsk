<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Kathy Dương · HSK 7–9 冲刺班 — 120 câu cổ ngữ ôn thi." />
  <meta name="theme-color" content="#2060B6" />
  <title>Kathy Dương · HSK 7–9 冲刺班</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">K</div>
        <div class="brand-copy">
          <h1>Kathy Dương</h1>
          <p class="han">HSK 7–9 冲刺班</p>
        </div>
      </div>

      <div class="sidebar-tools">
        <label class="search-box" for="searchInput">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="Tìm câu, nguồn, từ khóa…" autocomplete="off" />
        </label>
      </div>

      <nav id="categoryNav" class="category-nav" aria-label="Danh mục chủ đề"></nav>

      <div class="sidebar-progress">
        <div class="progress-row">
          <span>Đã thuộc</span>
          <strong id="learnedCount">0 / 120</strong>
        </div>
        <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
        <button class="sidebar-btn review" id="reviewNeedBtn" type="button">
          <span>●</span><span>Cần ôn</span><strong id="reviewNeedCount">0</strong>
        </button>
        <button class="sidebar-btn mistakes" id="reviewMistakesBtn" type="button">
          <span>●</span><span>Làm lại câu sai</span><strong id="mistakeCount">0</strong>
        </button>
      </div>
    </aside>

    <button class="sidebar-backdrop" id="sidebarBackdrop" aria-label="Đóng menu"></button>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Mở menu">☰</button>
        <div class="topbar-copy">
          <div class="eyebrow" id="sectionEyebrow">Chủ đề</div>
          <h2 id="categoryTitle" class="han">认识与思维</h2>
          <p id="categoryMeta">12 câu</p>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost" id="randomBtn" type="button">Câu ngẫu nhiên</button>
        </div>
      </header>

      <section class="study-overview" aria-label="Tổng quan học tập">
        <button class="overview-card learned-card" id="overviewLearned" type="button">
          <span class="overview-icon">✓</span>
          <span><small>Đã thuộc</small><strong id="overviewLearnedCount">0</strong></span>
        </button>
        <button class="overview-card review-card" id="overviewReview" type="button">
          <span class="overview-icon">●</span>
          <span><small>Cần ôn</small><strong id="overviewReviewCount">0</strong></span>
        </button>
        <button class="overview-card mistake-card" id="overviewMistake" type="button">
          <span class="overview-icon">!</span>
          <span><small>Câu sai</small><strong id="overviewMistakeCount">0</strong></span>
        </button>
      </section>

      <section class="workspace">
        <div class="tabs" role="tablist" aria-label="Chế độ học">
          <button class="tab active" type="button" data-tab="list" role="tab"><span>☷</span>Danh sách</button>
          <button class="tab" type="button" data-tab="flashcard" role="tab"><span>◇</span>Flashcard</button>
          <button class="tab" type="button" data-tab="practice" role="tab"><span>✓</span>Bài tập</button>
        </div>
        <div id="panel" class="panel"></div>
      </section>

      <footer class="footer">
        <span class="han">HSK 7–9 冲刺班 · 120 câu cổ ngữ</span>
        <span>Phát triển bởi <strong>Kathy Dương</strong></span>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js?v=3.7"></script>
  <script src="app.js?v=3.7"></script>
</body>
</html>
