<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2060B6" />
  <title>Kathy Dương｜HSK 7–9 冲刺班</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">KD</div>
        <div>
          <div class="brand-name">Kathy Dương</div>
          <div class="brand-sub">HSK 7–9 冲刺班</div>
        </div>
      </div>

      <nav class="main-nav">
        <button class="nav-item active" data-mode="learn"><span>学</span> 学习模式</button>
        <button class="nav-item" data-mode="quiz"><span>考</span> 考我模式</button>
        <button class="nav-item" data-mode="write"><span>写</span> 写作模式</button>
        <button class="nav-item" data-mode="review"><span>复</span> 今日复习</button>
      </nav>

      <div class="side-label">主题目录</div>
      <div class="topic-list" id="topicList"></div>

      <div class="sidebar-foot">
        <div class="mini-progress"><div id="sidebarProgress"></div></div>
        <div class="sidebar-stat"><span>学习进度</span><strong id="sidebarCount">0 / 12</strong></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="打开目录">☰</button>
        <div>
          <div class="eyebrow">古语 · 写作 · 思辨</div>
          <h1 id="pageTitle">一、认识与思维</h1>
        </div>
        <div class="top-actions">
          <button class="ghost-btn" id="hidePinyinBtn">隐藏拼音</button>
          <button class="primary-btn" id="randomBtn">随机一题</button>
        </div>
      </header>

      <section id="learnView" class="view active"></section>
      <section id="quizView" class="view"></section>
      <section id="writeView" class="view"></section>
      <section id="reviewView" class="view"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
