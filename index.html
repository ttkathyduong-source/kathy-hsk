<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="HSK 7–9 古语100句冲刺学习网页" />
  <title>古语100句 · HSK 7–9</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">古</div>
        <div>
          <h1>古语100句</h1>
          <p>HSK 7–9 冲刺</p>
        </div>
      </div>

      <div class="sidebar-tools">
        <label class="search-box">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="搜索古语 / 出处…" />
        </label>
      </div>

      <nav id="categoryNav" class="category-nav" aria-label="主题分类"></nav>

      <div class="sidebar-progress">
        <div class="progress-row">
          <span>学习进度</span>
          <strong id="learnedCount">0 / 100</strong>
        </div>
        <div class="progress-track"><span id="progressBar"></span></div>
        <button class="ghost-btn full" id="reviewMistakesBtn">复习错题</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="打开菜单">☰</button>
        <div>
          <div class="eyebrow" id="categoryTitle">认识与思维</div>
          <h2 id="pageTitle">不识庐山真面目，只缘身在此山中</h2>
        </div>
        <div class="topbar-actions">
          <button class="ghost-btn" id="randomBtn">随机一题</button>
          <button class="primary-btn" id="markLearnedBtn">✓ 我会了</button>
        </div>
      </header>

      <section class="hero-card">
        <div class="hero-main">
          <div class="item-number" id="itemNumber">01</div>
          <div>
            <h3 id="heroText">不识庐山真面目，只缘身在此山中</h3>
            <p class="pinyin" id="heroPinyin">bù shí lú shān zhēn miàn mù，zhǐ yuán shēn zài cǐ shān zhōng</p>
            <p class="source" id="heroSource">苏轼《题西林壁》</p>
          </div>
        </div>
        <div class="hero-actions">
          <button class="round-btn" id="favoriteBtn" title="收藏">☆</button>
          <button class="round-btn" id="speakBtn" title="朗读">🔊</button>
        </div>
      </section>

      <section class="item-strip-wrap">
        <button class="strip-arrow" id="prevBtn" aria-label="上一句">‹</button>
        <div class="item-strip" id="itemStrip"></div>
        <button class="strip-arrow" id="nextBtn" aria-label="下一句">›</button>
      </section>

      <section class="workspace">
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="meaning">释义 · Giải nghĩa</button>
          <button class="tab" data-tab="flashcard">Flashcard</button>
          <button class="tab" data-tab="practice">练习 · Bài tập</button>
          <button class="tab" data-tab="usage">活用 · Câu mẫu</button>
        </div>

        <div id="panel" class="panel"></div>
      </section>

      <footer class="footer">
        <span>HSK 7–9 古语学习站</span>
        <span>Phát triển bởi <strong>Kathy Dương</strong></span>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
